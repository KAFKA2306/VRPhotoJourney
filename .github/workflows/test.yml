name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  slideshow-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/SlideshowPathPolicy.Tests/SlideshowPathPolicy.Tests.csproj --configuration Release
